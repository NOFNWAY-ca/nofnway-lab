<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none';">
  <meta name="description" content="Charlie-Bug is a gentle dress-up explorer for little ones. Find four treasures hidden in the garden and dress up your bug!">
  <meta property="og:title" content="Charlie-Bug">
  <meta property="og:description" content="Charlie is a princess bug. Each day she dresses up as something new. Find five costume pieces and return to your tower!">
  <title>Charlie-Bug — Princess Dress-Up Adventure</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky:    #BFEFFF;
      --grass:  #7DC87A;
      --panel:  #FFFDF5;
      --text:   #2D2D2D;
      --dim:    #888;
      --accent: #FF6B6B;
      --gold:   #FFD700;
      --shadow: rgba(0,0,0,0.18);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 12%, rgba(255,255,255,0.65), transparent 22rem),
        linear-gradient(180deg, #AEEBFF 0%, #DDF8FF 62%, #9EDB72 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }

    iframe { border: none; }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      background: #BFEFFF;
    }

    #loading p {
      font: 700 20px sans-serif;
      color: #2D7D46;
    }

    /* ── Game canvas wrapper ── */
    #canvas-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 75% 14%, rgba(255,255,255,0.72), transparent 18rem),
        linear-gradient(180deg, #AEEBFF 0%, #DDF8FF 60%, #9EDB72 100%);
    }

    #game-canvas {
      display: block;
      width: min(100vw, 100svh);
      height: min(100vw, 100svh);
      image-rendering: auto;
      filter: saturate(1.08);
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      pointer-events: none;
      z-index: 10;
    }

    #hud-back {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      pointer-events: auto;
      background: rgba(255,255,255,0.68);
      color: #24533A;
      padding: 7px 12px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.75);
      text-shadow: none;
      box-shadow: 0 3px 0 rgba(52,95,54,0.18);
    }

    #hud-items {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #mute-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255,255,255,0.82);
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      box-shadow: 0 3px 0 rgba(56,91,51,0.16);
      cursor: pointer;
      font-size: 1rem;
      pointer-events: auto;
    }

    .hud-icon {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.66);
      border: 2px solid rgba(255,255,255,0.82);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      opacity: 0.45;
      transition: opacity 0.3s, transform 0.3s, background 0.3s;
      filter: grayscale(1);
      box-shadow: 0 3px 0 rgba(56,91,51,0.16);
    }

    .hud-icon.found {
      opacity: 1;
      filter: none;
      background: rgba(255,255,255,0.7);
      transform: scale(1.15);
      box-shadow: 0 3px 0 rgba(56,91,51,0.16), 0 0 12px rgba(255,230,50,0.72);
    }

    /* ── Celebrate overlay ── */
    #celebrate-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 20;
      background: transparent;
      pointer-events: none;
      padding: 24px 24px 38px;
      text-align: center;
    }

    #celebrate-overlay h2 {
      display: none;
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
      margin-bottom: 6px;
    }

    #celebrate-theme {
      display: none;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
    }

    #celebrate-canvas {
      display: none;
      border-radius: 50%;
      background: var(--sky);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }

    #play-again-btn {
      pointer-events: auto;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px 36px;
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #play-again-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }

    .celebrate-note {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--dim);
    }

    /* ── Virtual joystick ── */
    #joy-container {
      position: fixed;
      bottom: 28px;
      left: 28px;
      z-index: 15;
      pointer-events: auto;
    }

    #joy-base {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255,255,255,0.38);
      border: 3px solid rgba(255,255,255,0.72);
      position: relative;
      touch-action: none;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(44,87,58,0.16);
    }

    #joy-thumb {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid #5BC0EB;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform 0.05s;
      box-shadow: 0 4px 0 rgba(44,87,58,0.18);
    }

    /* ── Screen reader only ── */
    #sr-announce {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="loading">
  <p>👑 Loading Charlie-Bug…</p>
</div>

<!-- Screen reader announcements -->
<div id="sr-announce" aria-live="polite" aria-atomic="true"></div>

<!-- Game canvas -->
<div id="canvas-wrap">
  <canvas id="game-canvas" aria-label="Charlie-Bug garden explorer game" style="touch-action: none;"></canvas>
</div>

<!-- HUD -->
<div id="hud">
  <a href="/" id="hud-back">← Lab</a>
  <div id="hud-right">
    <div id="hud-items" aria-hidden="true">
      <div class="hud-icon" id="hud-hat"      title="Hat">🎩</div>
      <div class="hud-icon" id="hud-wings"    title="Wings">🦋</div>
      <div class="hud-icon" id="hud-antennae" title="Antennae">✨</div>
      <div class="hud-icon" id="hud-body"     title="Body">⭐</div>
      <div class="hud-icon" id="hud-dress"    title="Dress">👗</div>
    </div>
    <button id="mute-btn" type="button" onclick="toggleMute()" aria-label="Mute music">🔊</button>
  </div>
</div>

<!-- Celebrate overlay -->
<div id="celebrate-overlay" style="display:none">
  <h2>You made it home! 🏰</h2>
  <div id="celebrate-theme"></div>
  <canvas id="celebrate-canvas" width="120" height="120"></canvas>
  <button id="play-again-btn" onclick="playAgain()">Play Again</button>
  <p class="celebrate-note">Press Space or Enter to play again</p>
</div>

<!-- Virtual joystick (touch/mouse) -->
<div id="joy-container" style="display:none">
  <div id="joy-base">
    <div id="joy-thumb"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/draw.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>
  // Tap canvas to start (canvas fills the screen during title)
  document.getElementById('game-canvas').addEventListener('click', () => {
    if (state.screen === 'title') startDay();
  });
  // Initialise — call directly (all scripts above are synchronous, no need to wait for window.load)
  init();
</script>
</body>
</html>
